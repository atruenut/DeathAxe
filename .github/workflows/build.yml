name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built zips to this release tag (e.g. v1.2.0). Leave empty to only build.'
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, extra: "" }
          - { name: macos-universal, os: macos-latest, extra: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' }
          - { name: linux-x64, os: ubuntu-latest, extra: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch VST3 SDK
        shell: bash
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk vst3sdk

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMTG_CREATE_PLUGIN_LINK=OFF "${{ matrix.extra }}"

      - name: Build
        run: cmake --build build --config Release --target DeathAxe

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          P=$(find build -name 'DeathAxe.vst3' -not -path '*/vst3sdk/*' | head -1)
          echo "found: $P"
          test -n "$P"
          cp -R "$P" out/
          cp README.md GUIDE.md out/
          cd out && 7z a -tzip "../DeathAxe-${{ matrix.name }}.zip" . > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: DeathAxe-${{ matrix.name }}
          path: DeathAxe-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" artifacts/*.zip --repo "${{ github.repository }}" --title "DeathAxe $TAG" \
              --notes "VST3 builds for Windows (x64), macOS (universal, unsigned) and Linux (x64). Unzip and copy DeathAxe.vst3 to your VST3 folder. The custom editor window is currently Windows-only; macOS and Linux hosts show their generic parameter panel. See README.md."
          fi
